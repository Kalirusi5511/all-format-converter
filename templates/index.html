<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Full Format Converter</title>
    <style>
        body { font-family: system-ui; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #1e293b; padding: 40px; border-radius: 16px; width: 90%; max-width: 500px; text-align: center; }
        h1 { color: #38bdf8; }
        select, button, input[type="file"] { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #334155; background: #334155; color: white; }
        button { background: #38bdf8; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Full Format Converter</h1>
        <form method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <select name="target">
                <option value="jpg">JPG</option>
                <option value="png">PNG</option>
                <option value="webp">WEBP</option>
                <option value="mp4">MP4</option>
                <option value="mp3">MP3</option>
            </select>
            <button type="submit">Konvertieren</button>
        </form>
    </div>
</body>
</html>
